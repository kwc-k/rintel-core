[project]
name = "rintel"
version = "0.2.0"
description = "Repository Intelligence System — canonical evidence-graph indexer (MVP round 1)"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-fortran>=0.1.13",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "rustworkx==0.18.1",
]

[project.scripts]
ri = "rintel.cli:main"
rintel = "rintel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
]
