# rintel PostgreSQL migration configuration (SPEC-P1 §16-5).
# Usage: uv run alembic -c src/rintel/pg/alembic.ini upgrade head
[alembic]
script_location = %(here)s/alembic
# Override via RINTEL_DATABASE_URL env var (see env.py); sqlalchemy.url may be
# set explicitly here for non-default deployments.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
